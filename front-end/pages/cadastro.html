<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rental_Event | Cadastro</title>

    <link rel="stylesheet" href="../css/cadastro.css">

</head>

<body>

    <main class="cadastro-container">

        <section class="cadastro-box">

            <h1>Rental_Event</h1>

            <p class="subtitle">
                Crie sua conta
            </p>

            <form id="cadastroForm">

                <div class="input-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="Digite seu CPF"
                        maxlength="14"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="Digite seu telefone"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>


                <p id="mensagemErro"></p>

                <p id="mensagemSucesso"></p>


                <button type="submit">
                    Criar conta
                </button>

            </form>


            <div class="login-link">

                <p>
                    Já possui uma conta?
                </p>

                <a href="../index.html">
                    Voltar para o login
                </a>

            </div>

        </section>

    </main>


    <script src="../js/cadastro.js"></script>

</body>

</html>
